<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALIVIO | Solicitudes</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-white shadow-sm">

            <div class="container">

                <a class="navbar-brand" href="index.html">

                    <span class="logo-alivio">
                        ALIVIO
                    </span>

                    <small>
                        Enfermería a domicilio
                    </small>

                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuGestion"
                    aria-controls="menuGestion" aria-expanded="false" aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="menuGestion">

                    <ul class="navbar-nav ms-auto align-items-lg-center">

                        <li class="nav-item">

                            <a class="nav-link" href="index.html">

                                Volver al sitio

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

<!-- GESTIÓN DE SOLICITUDES -->

<section id="gestionSolicitudes" class="py-5">

    <div class="container">


        <!-- ENCABEZADO -->

        <div class="d-flex flex-column flex-md-row
                    justify-content-between
                    align-items-md-center
                    gap-3 mb-4">

            <div>

                <span class="seccion-etiqueta">
                    GESTIÓN
                </span>

                <h2 class="fw-bold mt-2 mb-1">
                    Solicitudes ALIVIO
                </h2>

                <p class="text-muted mb-0">
                    Registro de solicitudes realizadas.
                </p>

            </div>


            <!-- CONTADOR -->

            <div class="contador-solicitudes">

                <span id="contadorSolicitudes">
                    0
                </span>

                solicitudes

            </div>

        </div>



        <!-- BUSCADOR -->
    

        <div class="row mb-4">

            <div class="col-md-8">

                <label for="buscarSolicitud" class="form-label">

                    Buscar solicitud

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input type="text" class="form-control" id="buscarSolicitud"
                        placeholder="Buscar por código, cliente o distrito">

                </div>

            </div>


            <div class="col-md-4 mt-3 mt-md-0">

                <label for="filtroEstado" class="form-label">

                    Filtrar por estado

                </label>

                <select class="form-select" id="filtroEstado">

                    <option value="todos">
                        Todos
                    </option>

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="Confirmada">
                        Confirmada
                    </option>

                    <option value="Finalizada">
                        Finalizada
                    </option>

                    <option value="Cancelada">
                        Cancelada
                    </option>

                </select>

            </div>

        </div>


        <!-- TABLA -->

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Cliente
                        </th>

                        <th>
                            Servicio
                        </th>

                        <th>
                            Distrito
                        </th>

                        <th>
                            Fecha
                        </th>

                        <th>
                            Estado
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>

                </thead>


                <tbody id="tablaSolicitudes">

                    <!-- JavaScript generará
                         las filas aquí -->

                </tbody>

            </table>

        </div>


        <!-- MENSAJE CUANDO NO HAY SOLICITUDES -->

        <div id="sinSolicitudes" class="text-center py-5 d-none">

            <i class="bi bi-inbox display-4 text-muted"></i>

            <p class="text-muted mt-3">
                Todavía no hay solicitudes registradas.
            </p>

        </div>

    </div>

</section>

    <!-- MODAL DETALLE DE SOLICITUD -->


    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5" id="modalDetalleLabel">

                        Detalle de la solicitud

                    </h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>

                </div>

                <div class="modal-body" id="detalleSolicitudCuerpo">

                </div>

            </div>

        </div>

    </div>

    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JAVASCRIPT PROPIO -->


    <script src="js/app.js"></script>

</body>

</html>
