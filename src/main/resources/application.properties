spring.application.name=alivio-web
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${ALIVIO_DB_URL:jdbc:postgresql://localhost:5432/alivio_web}
spring.datasource.username=${ALIVIO_DB_USERNAME:postgres}
spring.datasource.password=${ALIVIO_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
alivio.demo.enabled=${ALIVIO_DEMO_ENABLED:false}
server.port=8080
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.tracking-modes=cookie
