<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profesionales | Alivio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/alivio.css}"></head><body>
<main class="container py-5">
  <nav aria-label="Administración" class="d-flex gap-3 mb-4"><a th:href="@{/}">Inicio</a><a th:href="@{/admin/solicitudes}">Solicitudes</a><a th:href="@{/admin/profesionales}" aria-current="page">Profesionales</a></nav>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="eyebrow">Administración · Demo</p><h1>Profesionales</h1><p>Registra personal y mantén al día su disponibilidad.</p></div><button class="btn btn-alivio" type="button" data-bs-toggle="modal" data-bs-target="#modalProfesional">Registrar profesional</button></div>
  <div th:if="${mensaje}" class="alert alert-success" role="status" aria-live="polite" th:text="${mensaje}"></div><div th:if="${error != null and modalError == null}" class="alert alert-danger" role="alert" aria-live="polite" th:text="${error}"></div>
  <div class="table-responsive"><table class="table table-hover align-middle"><caption class="visually-hidden">Profesionales registrados</caption><thead><tr><th scope="col">Código</th><th scope="col">Nombre</th><th scope="col">Tipo</th><th scope="col">Zona</th><th scope="col">Especialidad</th><th scope="col">Disponibilidad</th><th scope="col">Acciones</th></tr></thead><tbody>
    <tr th:if="${#lists.isEmpty(profesionales)}"><td colspan="7">Todavía no hay profesionales registrados.</td></tr>
    <tr th:each="profesional : ${profesionales}"><td th:text="${profesional.codigo}"></td><td th:text="${profesional.nombreCompleto}"></td><td th:text="${profesional.tipoProfesional == T(pe.edu.utp.alivio.model.TipoProfesional).LICENCIADA ? 'Licenciada en enfermería' : 'Técnica en enfermería'}"></td><td th:text="${profesional.zonaCobertura}"></td><td th:text="${#strings.replace(profesional.especialidad, '_', ' ')}"></td><td><span class="badge" th:classappend="${profesional.disponible} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${profesional.disponible} ? 'Disponible' : 'No disponible'"></span></td><td><div class="d-flex flex-wrap gap-2"><button class="btn btn-sm btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalEditarProfesional" th:attr="data-codigo=${profesional.codigo},data-nombre-completo=${profesional.nombreCompleto},data-tipo=${profesional.tipoProfesional},data-telefono=${profesional.telefono},data-zona-cobertura=${profesional.zonaCobertura},data-especialidad=${profesional.especialidad},data-disponible=${profesional.disponible}">Editar</button><form th:action="@{/admin/profesionales/{codigo}/disponibilidad(codigo=${profesional.codigo})}" method="post"><button class="btn btn-sm btn-outline-secondary" type="submit" th:text="${profesional.disponible} ? 'Marcar no disponible' : 'Marcar disponible'"></button></form></div></td></tr>
  </tbody></table></div>
</main>
<div class="modal fade" id="modalProfesional" tabindex="-1" aria-labelledby="tituloModalProfesional" aria-hidden="true" th:attr="data-error-modal=${modalError == 'registro' ? 'registro' : null}"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h4" id="tituloModalProfesional">Registrar profesional</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form th:action="@{/admin/profesionales}" method="post" th:object="${nuevoProfesional}"><div class="modal-body">
  <div th:if="${modalError == 'registro'}" class="alert alert-danger" role="alert" aria-live="polite" th:text="${error}"></div>
  <div class="mb-3"><label class="form-label" for="nuevoNombre">Nombre completo</label><input class="form-control" id="nuevoNombre" th:field="*{nombreCompleto}" th:attr="aria-describedby=${modalError == 'registro' and erroresCampo['nombreCompleto'] != null ? 'nuevoNombreError' : null}" required><div class="invalid-feedback d-block" id="nuevoNombreError" th:if="${modalError == 'registro' and erroresCampo['nombreCompleto'] != null}" th:text="${erroresCampo['nombreCompleto']}"></div></div>
  <div class="mb-3"><label class="form-label" for="nuevoTipo">Tipo</label><select class="form-select" id="nuevoTipo" name="tipoProfesional" th:attr="aria-describedby=${modalError == 'registro' and erroresCampo['tipoProfesional'] != null ? 'nuevoTipoError' : null}" required><option value="">Selecciona un tipo</option><option th:if="${modalError == 'registro' and valoresRechazados['tipoProfesional'] != null}" th:value="${valoresRechazados['tipoProfesional']}" selected="selected">Valor ingresado no válido</option><option th:each="tipo : ${tiposProfesional}" th:value="${tipo}" th:selected="${nuevoProfesional.tipoProfesional == tipo}" th:text="${tipo == T(pe.edu.utp.alivio.model.TipoProfesional).LICENCIADA ? 'Licenciada en enfermería' : 'Técnica en enfermería'}"></option></select><div class="invalid-feedback d-block" id="nuevoTipoError" th:if="${modalError == 'registro' and erroresCampo['tipoProfesional'] != null}" th:text="${erroresCampo['tipoProfesional']}"></div></div>
  <div class="mb-3"><label class="form-label" for="nuevoTelefono">Teléfono</label><input class="form-control" id="nuevoTelefono" th:field="*{telefono}" type="tel" inputmode="numeric" pattern="[9][0-9]{8}" maxlength="9" th:attr="aria-describedby=${modalError == 'registro' and erroresCampo['telefono'] != null ? 'nuevoTelefonoError' : null}" required><div class="invalid-feedback d-block" id="nuevoTelefonoError" th:if="${modalError == 'registro' and erroresCampo['telefono'] != null}" th:text="${erroresCampo['telefono']}"></div></div>
  <div class="mb-3"><label class="form-label" for="nuevaZona">Distrito o zona de cobertura</label><input class="form-control" id="nuevaZona" th:field="*{zonaCobertura}" th:attr="aria-describedby=${modalError == 'registro' and erroresCampo['zonaCobertura'] != null ? 'nuevaZonaError' : null}" required><div class="invalid-feedback d-block" id="nuevaZonaError" th:if="${modalError == 'registro' and erroresCampo['zonaCobertura'] != null}" th:text="${erroresCampo['zonaCobertura']}"></div></div>
  <div class="mb-3"><label class="form-label" for="nuevaEspecialidad">Especialidad principal</label><select class="form-select" id="nuevaEspecialidad" name="especialidad" th:attr="aria-describedby=${modalError == 'registro' and erroresCampo['especialidad'] != null ? 'nuevaEspecialidadError' : null}" required><option value="">Selecciona una especialidad</option><option th:if="${modalError == 'registro' and valoresRechazados['especialidad'] != null}" th:value="${valoresRechazados['especialidad']}" selected="selected">Valor ingresado no válido</option><option th:each="especialidad : ${especialidades}" th:value="${especialidad}" th:selected="${nuevoProfesional.especialidad == especialidad}" th:text="${#strings.replace(especialidad, '_', ' ')}"></option></select><div class="invalid-feedback d-block" id="nuevaEspecialidadError" th:if="${modalError == 'registro' and erroresCampo['especialidad'] != null}" th:text="${erroresCampo['especialidad']}"></div></div>
  <div class="form-check" th:unless="${modalError == 'registro' and valoresRechazados['disponible'] != null}"><input class="form-check-input" id="nuevaDisponible" th:field="*{disponible}" type="checkbox"><label class="form-check-label" for="nuevaDisponible">Disponible para asignación</label></div>
  <div class="mb-3" th:if="${modalError == 'registro' and valoresRechazados['disponible'] != null}"><label class="form-label" for="nuevaDisponibleRechazada">Disponibilidad ingresada</label><input class="form-control" id="nuevaDisponibleRechazada" name="disponible" type="text" th:value="${valoresRechazados['disponible']}" aria-describedby="nuevaDisponibleError"><div class="invalid-feedback d-block" id="nuevaDisponibleError" th:text="${erroresCampo['disponible']}"></div></div>
  </div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-alivio">Registrar</button></div></form></div></div></div>
<div class="modal fade" id="modalEditarProfesional" tabindex="-1" aria-labelledby="tituloModalEditarProfesional" aria-hidden="true" th:attr="data-error-modal=${modalError == 'edicion' ? 'edicion' : null},data-codigo-edicion=${codigoEdicion}"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h4" id="tituloModalEditarProfesional">Editar profesional</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><form method="post" th:object="${edicionProfesional}"><div class="modal-body">
  <div th:if="${modalError == 'edicion'}" class="alert alert-danger" role="alert" aria-live="polite" th:text="${error}"></div>
  <div class="mb-3"><label class="form-label" for="editarNombre">Nombre completo</label><input class="form-control" id="editarNombre" th:field="*{nombreCompleto}" th:attr="aria-describedby=${modalError == 'edicion' and erroresCampo['nombreCompleto'] != null ? 'editarNombreError' : null}" required><div class="invalid-feedback d-block" id="editarNombreError" th:if="${modalError == 'edicion' and erroresCampo['nombreCompleto'] != null}" th:text="${erroresCampo['nombreCompleto']}"></div></div>
  <div class="mb-3"><label class="form-label" for="editarTipo">Tipo</label><select class="form-select" id="editarTipo" name="tipoProfesional" th:attr="aria-describedby=${modalError == 'edicion' and erroresCampo['tipoProfesional'] != null ? 'editarTipoError' : null}" required><option value="">Selecciona un tipo</option><option th:if="${modalError == 'edicion' and valoresRechazados['tipoProfesional'] != null}" th:value="${valoresRechazados['tipoProfesional']}" selected="selected">Valor ingresado no válido</option><option th:each="tipo : ${tiposProfesional}" th:value="${tipo}" th:selected="${edicionProfesional.tipoProfesional == tipo}" th:text="${tipo == T(pe.edu.utp.alivio.model.TipoProfesional).LICENCIADA ? 'Licenciada en enfermería' : 'Técnica en enfermería'}"></option></select><div class="invalid-feedback d-block" id="editarTipoError" th:if="${modalError == 'edicion' and erroresCampo['tipoProfesional'] != null}" th:text="${erroresCampo['tipoProfesional']}"></div></div>
  <div class="mb-3"><label class="form-label" for="editarTelefono">Teléfono</label><input class="form-control" id="editarTelefono" th:field="*{telefono}" type="tel" inputmode="numeric" pattern="[9][0-9]{8}" maxlength="9" th:attr="aria-describedby=${modalError == 'edicion' and erroresCampo['telefono'] != null ? 'editarTelefonoError' : null}" required><div class="invalid-feedback d-block" id="editarTelefonoError" th:if="${modalError == 'edicion' and erroresCampo['telefono'] != null}" th:text="${erroresCampo['telefono']}"></div></div>
  <div class="mb-3"><label class="form-label" for="editarZona">Distrito o zona de cobertura</label><input class="form-control" id="editarZona" th:field="*{zonaCobertura}" th:attr="aria-describedby=${modalError == 'edicion' and erroresCampo['zonaCobertura'] != null ? 'editarZonaError' : null}" required><div class="invalid-feedback d-block" id="editarZonaError" th:if="${modalError == 'edicion' and erroresCampo['zonaCobertura'] != null}" th:text="${erroresCampo['zonaCobertura']}"></div></div>
  <div class="mb-3"><label class="form-label" for="editarEspecialidad">Especialidad principal</label><select class="form-select" id="editarEspecialidad" name="especialidad" th:attr="aria-describedby=${modalError == 'edicion' and erroresCampo['especialidad'] != null ? 'editarEspecialidadError' : null}" required><option value="">Selecciona una especialidad</option><option th:if="${modalError == 'edicion' and valoresRechazados['especialidad'] != null}" th:value="${valoresRechazados['especialidad']}" selected="selected">Valor ingresado no válido</option><option th:each="especialidad : ${especialidades}" th:value="${especialidad}" th:selected="${edicionProfesional.especialidad == especialidad}" th:text="${#strings.replace(especialidad, '_', ' ')}"></option></select><div class="invalid-feedback d-block" id="editarEspecialidadError" th:if="${modalError == 'edicion' and erroresCampo['especialidad'] != null}" th:text="${erroresCampo['especialidad']}"></div></div>
  <div class="form-check" th:unless="${modalError == 'edicion' and valoresRechazados['disponible'] != null}"><input class="form-check-input" id="editarDisponible" th:field="*{disponible}" type="checkbox"><label class="form-check-label" for="editarDisponible">Disponible para asignación</label></div>
  <div class="mb-3" th:if="${modalError == 'edicion' and valoresRechazados['disponible'] != null}"><label class="form-label" for="editarDisponibleRechazada">Disponibilidad ingresada</label><input class="form-control" id="editarDisponibleRechazada" name="disponible" type="text" th:value="${valoresRechazados['disponible']}" aria-describedby="editarDisponibleError"><div class="invalid-feedback d-block" id="editarDisponibleError" th:text="${erroresCampo['disponible']}"></div></div>
  </div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-alivio">Guardar cambios</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/admin.js}" defer></script></body></html>
