<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración | Alivio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/alivio.css}">
</head>
<body>
  <main class="container py-5" style="max-width: 32rem">
    <a th:href="@{/}">Volver al inicio</a>
    <h1 class="mt-4">Acceso administrativo</h1>
    <p>Ingresa con las credenciales del equipo de Alivio.</p>
    <div th:if="${param.error}" class="alert alert-danger" role="alert">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.salida}" class="alert alert-success" role="status">Sesión cerrada.</div>
    <form th:action="@{/admin/ingresar}" method="post">
      <div class="mb-3"><label for="username" class="form-label">Usuario</label>
        <input id="username" name="username" class="form-control" autocomplete="username" required></div>
      <div class="mb-3"><label for="password" class="form-label">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-alivio" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
