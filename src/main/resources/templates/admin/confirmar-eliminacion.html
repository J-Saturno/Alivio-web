<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar eliminación | Alivio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/alivio.css}">
</head>
<body>
  <main class="container py-5">
    <p class="eyebrow">Administración</p>
    <h1 th:text="${titulo}">Confirmar eliminación</h1>
    <p th:text="${detalle}"></p>
    <p class="alert alert-warning" id="avisoEliminacion">Esta acción elimina el registro de forma permanente.</p>
    <form th:action="@{${postAction}}" method="post" aria-describedby="avisoEliminacion" class="d-flex flex-wrap gap-3">
      <a class="btn btn-outline-secondary" th:href="@{${volver}}">Cancelar y volver</a>
      <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
    </form>
  </main>
</body>
</html>
